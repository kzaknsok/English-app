<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C-Core English Immersion (Wasm Mode)</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b132b; 
      color: #e0e1dd;
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      padding: 16px;
    }

    .card {
      background: #1c2541; 
      border: 1px solid #2a3d66; 
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 520px; 
      width: 100%; 
      padding: 28px 20px;
      position: relative;
    }

    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
      gap: 8px;
    }

    .scene-badge {
      background: rgba(72, 149, 239, 0.15); 
      color: #4895ef; 
      font-size: 0.75rem;
      font-weight: 700; 
      padding: 6px 12px; 
      border-radius: 20px; 
      border: 1px solid rgba(72, 149, 239, 0.3);
      text-transform: uppercase;
    }

    .mode-badge {
      background: rgba(74, 222, 128, 0.15); 
      color: #4ade80; 
      font-size: 0.75rem;
      font-weight: 700; 
      padding: 6px 12px; 
      border-radius: 20px; 
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .score-tracker { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: #4cc9f0; 
    }

    .en-display { 
      font-size: 1.35rem; 
      font-weight: 600; 
      color: #ffffff; 
      line-height: 1.6; 
      min-height: 80px; 
      margin-bottom: 20px; 
      word-break: break-word;
    }

    .blank { 
      color: #4cc9f0; 
      border-bottom: 3px solid #4cc9f0; 
      padding: 0 8px; 
      display: inline-block; 
      min-width: 70px; 
      text-align: center; 
    }

    .blank.correct { color: #4ade80; border-bottom-color: #4ade80; }
    .blank.incorrect { color: #f72585; border-bottom-color: #f72585; }

    .feedback-banner {
      min-height: 54px; 
      border-radius: 12px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      font-weight: 700; 
      font-size: 0.95rem;
      margin-bottom: 20px; 
      opacity: 0; 
      transition: all 0.25s ease;
      padding: 10px;
      text-align: center;
      gap: 4px;
    }

    .feedback-banner .ja-text {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .feedback-banner.show-correct { 
      opacity: 1; 
      background: rgba(74, 222, 128, 0.15); 
      border: 1px solid rgba(74, 222, 128, 0.4); 
      color: #4ade80; 
    }

    .feedback-banner.show-incorrect { 
      opacity: 1; 
      background: rgba(247, 37, 133, 0.15); 
      border: 1px solid rgba(247, 37, 133, 0.4); 
      color: #f72585; 
    }

    .options-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 24px; 
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px 16px;
      }
      .en-display {
        font-size: 1.15rem;
      }
      .options-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .option-btn {
        padding: 14px 10px;
        font-size: 1rem;
      }
    }

    .option-btn {
      background: #0b132b; 
      color: #e0e1dd; 
      border: 2px solid #2a3d66; 
      border-radius: 14px;
      padding: 16px 12px; 
      font-size: 1.05rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .option-btn.btn-correct { 
      background: rgba(74, 222, 128, 0.2) !important; 
      border-color: #4ade80 !important; 
      color: #4ade80 !important; 
    }

    .option-btn.btn-incorrect { 
      background: rgba(247, 37, 133, 0.2) !important; 
      border-color: #f72585 !important; 
      color: #f72585 !important; 
    }

    .action-btn {
      width: 100%; 
      background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%); 
      color: #ffffff;
      border: none; 
      border-radius: 14px; 
      padding: 16px; 
      font-size: 1.05rem; 
      font-weight: 700; 
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="top-bar">
      <div style="display:flex; gap:8px; align-items:center;">
        <span class="scene-badge" id="scene-badge">SCENE</span>
        <span class="mode-badge">WASM CORE</span>
      </div>
      <div class="score-tracker" id="score-tracker">Streak: 0</div>
    </div>

    <div class="en-display" id="en-display">Loading C-Wasm Engine...</div>
    <div class="feedback-banner" id="feedback-banner"></div>
    <div class="options-grid" id="options-grid"></div>
    <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Phrase ➔ (Enter/Space)</button>
  </div>

  <script src="logic.js"></script>

  <script>
    let questionsData = [];
    let currentData = null;
    let isAnswered = false;
    let streakCount = 0;
    let correctAnswer = "";

    Module.onRuntimeInitialized = async () => {
      Module._init_rand();
      const res = await fetch('questions.json');
      questionsData = await res.json();
      nextQuestion();
    };

    function nextQuestion() {
      if (!questionsData.length) return;

      isAnswered = false;
      const banner = document.getElementById("feedback-banner");
      banner.className = "feedback-banner";
      banner.innerHTML = "";

      const idx = Module._get_random_index(questionsData.length);
      currentData = questionsData[idx];

      renderCard(currentData);
    }

    function renderCard(data) {
      document.getElementById("scene-badge").textContent = data.sceneName || data.sceneId;

      const enTemplate = data.en_template || data.en || "%s";
      const enHtml = enTemplate.replace("%s", `<span class="blank" id="blank-target">_____</span>`);
      document.getElementById("en-display").innerHTML = enHtml;

      correctAnswer = data.correct_option || (data.options ? data.options[0] : "");
      let rawOptions = [];
      if (data.other_options) {
        rawOptions = [correctAnswer, ...data.other_options];
      } else if (data.options) {
        rawOptions = [...data.options];
      }

      const count = rawOptions.length;
      let indices = Array.from({length: count}, (_, i) => i);

      for (let i = count - 1; i > 0; i--) {
        const j = Module._get_random_index(i + 1);
        const temp = indices[i];
        indices[i] = indices[j];
        indices[j] = temp;
      }

      const shuffledOptions = indices.map(i => rawOptions[i]);

      const grid = document.getElementById("options-grid");
      grid.innerHTML = "";

      shuffledOptions.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.dataset.word = opt;
        btn.textContent = `[${index + 1}] ${opt}`;
        
        btn.onclick = () => checkAnswer(opt, btn);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(selectedWord, btnElement) {
      if (isAnswered) return;
      isAnswered = true;

      const isCorrect = (selectedWord === correctAnswer);
      
      const blank = document.getElementById("blank-target");
      const banner = document.getElementById("feedback-banner");

      document.querySelectorAll(".option-btn").forEach(b => {
        b.disabled = true;
        if (b.dataset.word === correctAnswer) {
          b.classList.add("btn-correct");
        }
      });

      if (blank) blank.textContent = selectedWord;

      // 日本語訳がある場合は取得
      const jaTranslation = currentData.ja ? `<div class="ja-text">💬 訳: ${currentData.ja}</div>` : '';

      if (isCorrect) {
        if (blank) blank.classList.add("correct");
        banner.className = "feedback-banner show-correct";
        banner.innerHTML = `<div>🎉 Excellent! Correct!</div>${jaTranslation}`;
        streakCount++;
      } else {
        if (blank) blank.classList.add("incorrect");
        if (btnElement) btnElement.classList.add("btn-incorrect");
        banner.className = "feedback-banner show-incorrect";
        banner.innerHTML = `<div>❌ Correct answer: <strong>${correctAnswer}</strong></div>${jaTranslation}`;
        streakCount = 0;
      }

      document.getElementById("score-tracker").textContent = `Streak: ${streakCount}`;
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key;
      if (['1', '2', '3', '4'].includes(key)) {
        const index = parseInt(key) - 1;
        const buttons = document.querySelectorAll('.option-btn');
        if (buttons[index] && !buttons[index].disabled) {
          buttons[index].click();
        }
      }
      
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        document.getElementById('next-btn').click();
      }
    });
  </script>
</body>
</html>
